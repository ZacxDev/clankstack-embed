name: release-broker

# Tag the broker to build + push a public image:
#   git tag broker-v0.3.4 && git push origin broker-v0.3.4
on:
  push:
    tags: ["broker-v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: derive version
        id: v
        run: echo "version=${GITHUB_REF_NAME#broker-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: broker
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/zacxdev/clankstack-broker:${{ steps.v.outputs.version }}
            ghcr.io/zacxdev/clankstack-broker:latest

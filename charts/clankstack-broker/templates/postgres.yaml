{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "clankstack-broker.postgresHost" . }}
  labels:
    {{- include "clankstack-broker.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.postgres.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clankstack-broker.postgresHost" . }}
  labels:
    {{- include "clankstack-broker.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "clankstack-broker.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "clankstack-broker.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: broker }
            - { name: POSTGRES_DB, value: broker }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "clankstack-broker.secretName" . }}
                  key: POSTGRES_PASSWORD
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U broker -d broker"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "clankstack-broker.postgresHost" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clankstack-broker.postgresHost" . }}
  labels:
    {{- include "clankstack-broker.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "clankstack-broker.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
{{- end }}

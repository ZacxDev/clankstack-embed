apiVersion: v1
kind: Service
metadata:
  name: {{ include "clankstack-broker.fullname" . }}
  labels:
    {{- include "clankstack-broker.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "clankstack-broker.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: broker
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http

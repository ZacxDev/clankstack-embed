{{- if not .Values.broker.existingSecret }}
{{- $secretName := include "clankstack-broker.secretName" . -}}
{{- /* Reuse existing values on upgrade so secrets/DB-auth stay stable. */ -}}
{{- $existing := dict -}}
{{- with (lookup "v1" "Secret" .Release.Namespace $secretName) }}{{- $existing = .data -}}{{- end -}}
{{- $jwt := .Values.broker.jwtSecret | default (get $existing "BROKER_JWT_SECRET" | b64dec) | default (randAlphaNum 48) -}}
{{- $sk := .Values.broker.secretKey | default (get $existing "BROKER_SK" | b64dec) | default (printf "sk_live_%s" (randAlphaNum 40)) -}}
{{- $dburl := "" -}}
{{- $pgpw := "" -}}
{{- if .Values.postgres.enabled -}}
{{- $pgpw = .Values.postgres.password | default (get $existing "POSTGRES_PASSWORD" | b64dec) | default (randAlphaNum 32) -}}
{{- $dburl = printf "postgres://broker:%s@%s:5432/broker?sslmode=disable" $pgpw (include "clankstack-broker.postgresHost" .) -}}
{{- else -}}
{{- $dburl = .Values.externalDatabaseUrl -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "clankstack-broker.labels" . | nindent 4 }}
type: Opaque
stringData:
  BROKER_JWT_SECRET: {{ $jwt | quote }}
  BROKER_SK: {{ $sk | quote }}
  DATABASE_URL: {{ $dburl | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ $pgpw | quote }}
  {{- end }}
{{- end }}

{{- if .Values.embeds }}
{{- $items := list -}}
{{- range .Values.embeds -}}
{{- $o := dict
    "publishable_key" .publishableKey
    "status" (.status | default "enabled")
    "agent" .agent
    "allowed_origins" .allowedOrigins
    "daily_token_budget" (.dailyTokenBudget | default 50000)
    "per_session_msg_budget" (.perSessionMsgBudget | default 20)
    "per_session_tok_budget" (.perSessionTokBudget | default 8000)
    "sessions_per_min" (.sessionsPerMin | default 20) -}}
{{- with .gatewayUrl }}{{- $_ := set $o "gateway_url" . -}}{{- end -}}
{{- with .hooksToken }}{{- $_ := set $o "hooks_token" . -}}{{- end -}}
{{- with .agentRef }}{{- $_ := set $o "agent_ref" . -}}{{- end -}}
{{- with .model }}{{- $_ := set $o "model" . -}}{{- end -}}
{{- with .title }}{{- $_ := set $o "title" . -}}{{- end -}}
{{- with .greeting }}{{- $_ := set $o "greeting" . -}}{{- end -}}
{{- $items = append $items $o -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clankstack-broker.fullname" . }}-embeds
  labels:
    {{- include "clankstack-broker.labels" . | nindent 4 }}
type: Opaque
stringData:
  embeds.json: {{ $items | toJson | quote }}
{{- end }}

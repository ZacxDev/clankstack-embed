<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&lt;kubeclaw-agent&gt; demo</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        background: #f7f8fa;
        color: #1f2330;
      }
      header {
        padding: 32px 24px;
        background: #6d28d9;
        color: #fff;
      }
      header h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      header p {
        margin: 0;
        opacity: 0.9;
        font-size: 14px;
      }
      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 24px;
        display: grid;
        gap: 24px;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e4e9;
        border-radius: 16px;
        padding: 16px;
      }
      .card h2 {
        margin: 0 0 12px;
        font-size: 15px;
      }
      .inline-host {
        height: 460px;
      }
      /* Theme override via CSS custom properties — works because the element
         exposes them as inheritable :host vars. */
      kubeclaw-agent.brand {
        --kc-accent: #0ea5e9;
        --kc-radius: 10px;
      }
      /* ::part theming example */
      kubeclaw-agent.brand::part(header) {
        background: #0ea5e9;
        color: #fff;
      }
    </style>

    <!--
      Local demo: this loads the built bundle from ../dist/agent.js.
      Build first with:  nix-shell -p nodejs --run "npm run build"

      The component talks to a BROKER, never the agent gateway directly.
      Point `endpoint` at your locally-running Go broker, e.g.:
          endpoint="http://localhost:8787"
      Default is https://api.kubeclaw.dev.
    -->
    <script type="module" src="../dist/agent.js"></script>
  </head>
  <body>
    <header>
      <h1>kubeclaw-agent embed demo</h1>
      <p>Inline panel + floating popup launcher, with theme overrides.</p>
    </header>

    <main>
      <div class="card">
        <h2>Inline mode (embedded panel)</h2>
        <div class="inline-host">
          <kubeclaw-agent
            class="brand"
            mode="inline"
            theme="light"
            publishable-key="pk_live_demo_inline"
            endpoint="http://localhost:8787"
            title="Docs Assistant"
            greeting="Hey! Ask me anything about the docs."
            placeholder="Ask about the docs…"
          ></kubeclaw-agent>
        </div>
      </div>

      <div class="card">
        <h2>Popup mode (floating launcher, bottom-right)</h2>
        <p style="font-size: 14px; color: #6b7280; margin: 0">
          Look for the purple chat button in the bottom-right corner. It uses
          the default theme (<code>auto</code>) and persists a visitor id.
        </p>
        <kubeclaw-agent
          mode="popup"
          theme="auto"
          persist-session
          publishable-key="pk_live_demo_popup"
          endpoint="http://localhost:8787"
          title="Sales Bot"
          greeting="👋 Hi! How can I help you today?"
        ></kubeclaw-agent>
      </div>

      <div class="card">
        <h2>Event log</h2>
        <pre id="log" style="font-size: 12px; max-height: 180px; overflow: auto; margin: 0"></pre>
      </div>
    </main>

    <script type="module">
      const log = document.getElementById('log');
      const write = (line) => {
        log.textContent += line + '\n';
        log.scrollTop = log.scrollHeight;
      };
      for (const name of [
        'kubeclaw:ready',
        'kubeclaw:session',
        'kubeclaw:open',
        'kubeclaw:close',
        'kubeclaw:message',
        'kubeclaw:error',
      ]) {
        document.addEventListener(name, (e) => {
          write(`${name} ${JSON.stringify(e.detail ?? {})}`);
        });
      }
    </script>
  </body>
</html>
